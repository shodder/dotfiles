name: Bash Lint & Format Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sh-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck & shfmt
        uses: luizm/action-sh-checker@v0.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHFMT_OPTS: "-i 2 -ci"   # 2-space indent, indent case statements
        with:
          sh_checker_comment: true       # posts PR review comments
          sh_checker_shfmt_disable: false
          sh_checker_shellcheck_disable: false